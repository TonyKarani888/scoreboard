<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="gamecard">
      <div id="homescore">
        <h1 class="title">HOME</h1>
        <div class="score" id="hscore">0</div>
        <div>
          <button class="scrbtn" id="hscb1">+1</button>
          <button class="scrbtn" id="hscb2">+2</button>
          <button class="scrbtn" id="hscb3">+3</button>
        </div>
      </div>
      <div id="awayscore">
        <h1 class="title">GUEST</h1>
        <div class="score" id="ascore">0</div>
        <div>
          <button class="scrbtn" id="ascb1">+1</button>
          <button class="scrbtn" id="ascb2">+2</button>
          <button class="scrbtn" id="ascb3">+3</button>
        </div>
      </div>
    </div>
    <button id="reset">Reset</button>
    <script src="index.js"></script>
  </body>
</html>
